# The load generator runs inside the cluster so that its requests go through the Service and kube-proxy to
# whichever pod is next, like any client would. (kubectl port-forward would pin all traffic to one pod.)
# It is pinned to the server node (k3s labels it node-role.kubernetes.io/control-plane), which is never drained, so draining a worker cannot disturb the
# thing that is counting errors.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  labels:
    app: loadgen
    app.kubernetes.io/name: loadgen
    app.kubernetes.io/part-of: zero-downtime
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
        app.kubernetes.io/name: loadgen
        app.kubernetes.io/part-of: zero-downtime
    spec:
      serviceAccountName: loadgen
      enableServiceLinks: false
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: zero-downtime-loadgen
          ports:
            - name: control
              containerPort: 9100
          env:
            - name: TARGET_URL
              value: http://web.zero-downtime.svc.cluster.local/
            - name: RATE_PER_SECOND
              value: "100"
            - name: TIMEOUT_SECONDS
              value: "2"
            - name: MAX_IN_FLIGHT
              value: "256"
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: control
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: control
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: loadgen
  labels:
    app.kubernetes.io/name: loadgen
    app.kubernetes.io/part-of: zero-downtime
spec:
  selector:
    app: loadgen
  ports:
    - name: control
      port: 9100
      targetPort: control
