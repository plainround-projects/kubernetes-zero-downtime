<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="t d">
<title id="t">Architecture of the zero-downtime cluster</title>
<desc id="d">In a k3d cluster with one tainted server node and three worker nodes, a load generator on the server node sends 100 requests a second to Service web, which routes only to ready web pods on worker nodes 1, 2 and 3. The HPA scales the pods from 6 to 20 at 60 percent CPU, and the disruption budget allows one voluntary disruption at a time. Two amber notes show the naive overlay that refuses connections and the graceful overlay with the preStop sleep that ends at zero errors.</desc>
<style>
:root{--paper:#ffffff;--ink:#10243d;--mute:#52677f;--accent:#0a6aa8;--good:#19743f;--warn:#8a5a00}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="829" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="828" rx="16"/>
<text class="title" x="48" y="68">Roll, scale and drain without errors</text>
<text class="caption" x="48" y="100">The generator counts every failed request. Amber: the naive step that fails and the graceful step that fixes it.</text>
<rect class="boundary" x="48" y="132" width="272" height="192" rx="14"/>
<text class="tag" x="64" y="160">Server node: tainted</text>
<rect class="svc" x="72" y="176" width="224" height="124" rx="12"/>
<text class="name" x="88" y="208">Load generator</text>
<text class="sub" x="88" y="232">100 requests a second</text>
<text class="sub" x="88" y="254">counts every error</text>
<text class="sub" x="88" y="276">control API :9100</text>
<rect class="svc" x="392" y="180" width="212" height="96" rx="12"/>
<text class="name" x="408" y="212">Service web</text>
<text class="sub" x="408" y="236">web:80</text>
<text class="sub" x="408" y="258">ready pods only</text>
<rect class="note" x="700" y="132" width="452" height="124" rx="10"/>
<text class="label b t-warn" x="716" y="162">graceful: preStop sleep 15 s</text>
<text class="sub" x="716" y="188">pods leave the Service first,</text>
<text class="sub" x="716" y="210">then stop: errors: 0 under load</text>
<rect class="boundary" x="48" y="372" width="336" height="200" rx="14"/>
<text class="tag" x="64" y="400">Worker node 1</text>
<rect class="svc" x="72" y="424" width="288" height="124" rx="12"/>
<text class="name" x="88" y="456">web pods</text>
<text class="sub" x="88" y="480">readiness /readyz</text>
<text class="sub" x="88" y="502">preStop sleep 15 s</text>
<text class="sub" x="88" y="524">grace period 40 s</text>
<rect class="boundary" x="432" y="372" width="336" height="200" rx="14"/>
<text class="tag" x="600" y="400">Worker node 2</text>
<rect class="svc" x="456" y="424" width="288" height="124" rx="12"/>
<text class="name" x="472" y="456">web pods</text>
<text class="sub" x="472" y="480">readiness /readyz</text>
<text class="sub" x="472" y="502">preStop sleep 15 s</text>
<text class="sub" x="472" y="524">grace period 40 s</text>
<rect class="boundary" x="816" y="372" width="336" height="200" rx="14"/>
<text class="tag" x="832" y="400">Worker node 3</text>
<rect class="svc" x="840" y="424" width="288" height="124" rx="12"/>
<text class="name" x="856" y="456">web pods</text>
<text class="sub" x="856" y="480">readiness /readyz</text>
<text class="sub" x="856" y="502">preStop sleep 15 s</text>
<text class="sub" x="856" y="524">grace period 40 s</text>
<rect class="svc" x="476" y="616" width="240" height="106" rx="12"/>
<text class="name" x="492" y="648">Disruption budget</text>
<text class="sub" x="492" y="672">maxUnavailable 1</text>
<text class="sub" x="492" y="694">guards voluntary drains</text>
<rect class="svc" x="864" y="616" width="204" height="106" rx="12"/>
<text class="name" x="880" y="648">HPA</text>
<text class="sub" x="880" y="672">6 to 20 pods</text>
<text class="sub" x="880" y="694">CPU at 60%</text>
<rect class="note" x="48" y="616" width="360" height="124" rx="10"/>
<text class="label b t-warn" x="64" y="646">make deploy OVERLAY=naive</text>
<text class="sub" x="64" y="672">no readiness probe: a new pod</text>
<text class="sub" x="64" y="694">gets traffic while its port</text>
<text class="sub" x="64" y="716">refuses connections</text>
<path class="sync" d="M296 228H392"/>
<text class="label t-accent" x="330" y="218">GET /</text>
<path class="sync" d="M420 276V328Q420 340 408 340H228Q216 340 216 352V424"/>
<path class="sync" d="M500 276V424"/>
<text class="label t-accent" x="512" y="324">ready pods only</text>
<path class="sync" d="M580 276V328Q580 340 592 340H968Q980 340 980 352V424"/>
<path class="sync" d="M596 616V548"/>
<text class="label t-accent" x="608" y="594">guards drain</text>
<path class="sync" d="M966 616V548"/>
<text class="label t-accent" x="978" y="594">scales</text>
<path class="sync" d="M48 786H112"/><text class="legend" x="124" y="791">sync call</text>
</svg>
